# Production pipeline — render + publish approved ideas.
# SKELETON: manual-trigger only for now. Uncomment the schedule once modules work (rule 7).
# Cron is UTC (rule 15): stagger 4–5 posts through the day. 08:00 IST ~= 02:30 UTC.
name: production

on:
  workflow_dispatch: {}        # run manually from the Actions tab
  # schedule:
  #   - cron: "30 2,5,8,11,14 * * *"   # UTC, staggered — enable when ready

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg + espeak-ng (Kokoro TTS phonemizer)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Cache TTS/ASR models (Kokoro + faster-whisper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/huggingface
          key: models-kokoro1.0-whisper-base-v1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run production pipeline
        env:                     # secrets configured in repo Settings -> Secrets (rule 5)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_APPROVAL_MODE: ${{ vars.TELEGRAM_APPROVAL_MODE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VOICE_ENGINE: ${{ vars.VOICE_ENGINE || 'gemini' }}          # gemini | google | edge | kokoro (chain)
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}       # Chirp 3 HD; empty -> falls back to edge-tts
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}              # an en-IN Chirp3-HD voice name
          GOOGLE_TTS_LANGUAGE: ${{ vars.GOOGLE_TTS_LANGUAGE || 'en-IN' }}
          ENABLE_HUMAN_ANGLE: ${{ vars.ENABLE_HUMAN_ANGLE || 'true' }}  # require a genuine why-it-matters take
          CAPTION_FONT: ${{ vars.CAPTION_FONT || 'Montserrat' }}
          CAPTION_HIGHLIGHT_COLOR: ${{ vars.CAPTION_HIGHLIGHT_COLOR || '&H0000FFFF' }}  # active-word fill colour
          ENABLE_TEXT_CARDS: ${{ vars.ENABLE_TEXT_CARDS || 'true' }}  # on-screen key-point cards (story-specific)
          CARD_SECONDS: ${{ vars.CARD_SECONDS || '1.8' }}            # how long each key-point card flashes
          NEWS_RSS_URL: ${{ vars.NEWS_RSS_URL }}                     # optional: override the news feed seeding ideation
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
          VISUAL_SOURCE: ${{ vars.VISUAL_SOURCE || 'photos' }}        # photos | ai | video
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          IMAGE_STYLE: ${{ vars.IMAGE_STYLE }}
          CAPTION_WORDS: ${{ vars.CAPTION_WORDS || '3' }}            # words per karaoke phrase
          ENABLE_DESC_FOOTER: ${{ vars.ENABLE_DESC_FOOTER || 'true' }}  # append brand footer to descriptions
          DESCRIPTION_FOOTER: ${{ vars.DESCRIPTION_FOOTER }}         # optional: override the default footer
          ENABLE_HOOK_CAPTION: ${{ vars.ENABLE_HOOK_CAPTION || 'true' }}  # frame-1 title hook banner (CTR)
          HOOK_SECONDS: ${{ vars.HOOK_SECONDS || '1.8' }}            # how long the hook banner shows
          CLIP_SECONDS: ${{ vars.CLIP_SECONDS || '3.5' }}           # B-roll cut length (fast = more retention)
          ENABLE_HOOK_JUDGE: ${{ vars.ENABLE_HOOK_JUDGE || 'true' }} # LLM punches up weak hooks/titles pre-render
          KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '1.0' }}
          ENABLE_DRAMATIC_PACING: ${{ vars.ENABLE_DRAMATIC_PACING || 'true' }}  # snappier mid-script + beat before payoff
          PAUSE_BETWEEN: ${{ vars.PAUSE_BETWEEN || '0.18' }}        # inter-sentence silence (s)
          PAUSE_BEFORE_PAYOFF: ${{ vars.PAUSE_BEFORE_PAYOFF || '0.5' }}  # dramatic beat before the last line (s)
          MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME || '0.10' }}
          ENABLE_SFX: ${{ vars.ENABLE_SFX || 'true' }}              # transition stings on clip cuts
          SFX_VOLUME: ${{ vars.SFX_VOLUME || '0.18' }}              # 0..1; 0 disables. >0.3 fights the narration
          SFX_EVERY_N_CUTS: ${{ vars.SFX_EVERY_N_CUTS || '2' }}     # sting every Nth cut (1 = every cut, busy)
          ENABLE_GRAPHIC_CARDS: ${{ vars.ENABLE_GRAPHIC_CARDS || 'false' }}  # PIL stat cards vs ASS text cards
          ENABLE_CHANNEL_TAGS: ${{ vars.ENABLE_CHANNEL_TAGS || 'true' }}     # append core channel tags after SEO tags
          # Optional 3rd LLM provider. GH_ prefix is REQUIRED: GitHub rejects secret/variable
          # names starting with GITHUB_. Inert unless ENABLE_GH_MODELS/PREFER_GH_MODELS is true.
          GH_MODELS_KEY: ${{ secrets.GH_MODELS_KEY }}               # PAT scoped to `models: read` only
          ENABLE_GH_MODELS: ${{ vars.ENABLE_GH_MODELS || 'false' }}  # opt-in: middle fallback
          PREFER_GH_MODELS: ${{ vars.PREFER_GH_MODELS || 'false' }}  # opt-in: try it first
          GH_MODEL: ${{ vars.GH_MODEL || 'openai/gpt-4o-mini' }}     # publisher/model form is required
          # Expressive delivery. Tag support differs per engine: Chirp reads [pause] via markup,
          # Gemini TTS reads [sarcastic]-style tags, edge/Kokoro read neither.
          GOOGLE_TTS_SPEAKING_RATE: ${{ vars.GOOGLE_TTS_SPEAKING_RATE }}  # 0.25-2.0, unset = default
          ENABLE_PAUSE_MARKUP: ${{ vars.ENABLE_PAUSE_MARKUP || 'true' }}  # [pause] -> Chirp markup
          MAX_PAUSE_TAGS: ${{ vars.MAX_PAUSE_TAGS || '3' }}
          MAX_STYLE_TAGS: ${{ vars.MAX_STYLE_TAGS || '3' }}
          SFX_DIR: ${{ vars.SFX_DIR }}                              # where generated SFX wavs cache
          CAPTION_FONT_FILE: ${{ vars.CAPTION_FONT_FILE }}          # ttf for libass + stat cards
          VOICE_STYLE_PROMPT: ${{ vars.VOICE_STYLE_PROMPT }}          # gemini engine only
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-2.5-flash-preview-tts' }}  # free tier
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Zubenelgenubi' }}  # chosen by ear; bare name
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}       # optional; isolates TTS quota
          DAILY_REEL_CAP: ${{ vars.DAILY_REEL_CAP || '3' }}           # operator ships 3 Shorts/day
          APPROVAL_CAP: ${{ vars.APPROVAL_CAP || '3' }}               # keep approvals in step with it
          ENABLE_FACT_CHECK: ${{ vars.ENABLE_FACT_CHECK || 'true' }}   # re-verify every script pre-render
          FACTCHECK_STRICT: ${{ vars.FACTCHECK_STRICT || 'false' }}    # true = block when the checker cannot run
        run: python -m src.production
