# Production pipeline — render + publish approved ideas.
# Manual-only ON PURPOSE: the operator runs on demand (make-short / /makeshort, 2026-09-29).
# Scheduled digests started 6.5-7 h late, so a schedule should come from somewhere punctual.
# Cron is UTC (rule 15): stagger 4–5 posts through the day. 08:00 IST ~= 02:30 UTC.
name: production

on:
  workflow_dispatch: {}        # run manually from the Actions tab
  # schedule:
  #   - cron: "30 2,5,8,11,14 * * *"   # UTC, staggered — enable when ready

# One pipeline run at a time. Two runs started close together re-offer the same pending ideas,
# both wait on the same tap, and both render and upload: publish's idempotency check is empty
# until one of them has finished uploading.
concurrency:
  group: reel-pipeline
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    # Bounded like make-short. Without this the job inherits GitHub's 6-hour default,
    # so a wedged render or a hung upload burns Actions minutes until someone notices.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      # The pipeline's time-limit guard counts down from here (src/production.py). Python starts
      # only after checkout, apt and pip, and on 2026-10-22 apt alone took 16+ minutes.
      - name: Note when the job started
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      # Keyless auth to Google Cloud. This org's policy blocks BOTH API keys and service-account
      # keys, so there is no credential to store — GitHub's OIDC token is exchanged for a short
      # lived one via Workload Identity Federation. `id-token: write` below is what mints it.
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/892249248253/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: reel-factory-ci@but-it-matters-tts.iam.gserviceaccount.com

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Cached .debs; see make-short.yml for why (a crawling mirror, 2026-10-22).
      - name: Cache apt packages (FFmpeg + espeak-ng + Tesseract)
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-ffmpeg-espeak-ng-tesseract-v2

      - name: Install FFmpeg, espeak-ng (Kokoro TTS phonemizer) and Tesseract (the still check)
        run: |
          sudo apt-get update
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install -y --download-only ffmpeg espeak-ng tesseract-ocr
          cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          sudo apt-get install -y ffmpeg espeak-ng tesseract-ocr

      - name: Cache TTS/ASR models (Kokoro + faster-whisper)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/huggingface
          key: models-kokoro1.0-whisper-base-v1

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run production pipeline
        timeout-minutes: 55      # inside the job's 60, so the alert below still runs
        env:                     # secrets configured in repo Settings -> Secrets (rule 5)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}              # ungrounded text; own per-model free budget
          GEMINI_GROUNDED_MODEL: ${{ vars.GEMINI_GROUNDED_MODEL || 'gemini-3.5-flash-lite,gemini-3.5-flash' }} # off gemini-2.5-flash (retires 2026-10-20); a 404 moves down the chain
          FACTCHECK_MODEL: ${{ vars.FACTCHECK_MODEL || 'gemini-3.5-flash,gemini-3.5-flash-lite' }} # the gate's own, stronger chain
          IDEATION_MODEL: ${{ vars.IDEATION_MODEL || 'gemini-3.5-flash-lite,gemini-3.5-flash' }} # researched in prose, where 3.x keeps citations (2.5-flash retires 2026-10-20)
          # Serve Gemini through Vertex AI rather than the Developer API. The free Developer
          # tier allowed 20 grounded requests/DAY, shared by ideation, the scriptwriter and the
          # fact-check gate, so it ran dry and the GATE was what broke (2026-09-03). On Vertex,
          # Gemini 3 grounding is free up to 5,000 queries/MONTH, then billed; tokens are billed.
          GEMINI_USE_VERTEX: ${{ vars.GEMINI_USE_VERTEX || 'true' }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT || 'but-it-matters-tts' }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION || 'global' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Claude writes the final script from Gemini's grounded draft (paid API). No key, a spent
          # month or ENABLE_CLAUDE_SCRIPT=false -> the grounded draft ships, as before 2026-10-22.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT || 'low' }}                  # low ~$0.037 a script, medium ~$0.066
          ANTHROPIC_MONTHLY_BUDGET_USD: ${{ vars.ANTHROPIC_MONTHLY_BUDGET_USD || '4' }} # held by the claude_spend ledger
          ENABLE_CLAUDE_SCRIPT: ${{ vars.ENABLE_CLAUDE_SCRIPT }}                    # empty = on
          # Higgsfield (Kling shots): every job is reserved in ai_video_jobs before it is bought;
          # unset, nothing is bought. Shots are bought only with VISUAL_SOURCE=ai_video.
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          # The AI-video shots (design 12): what one reel may spend, and its time limits. There is
          # no monthly or count cap in code, by the operator's choice (2026-11-10).
          AI_VIDEO_MODEL: ${{ vars.AI_VIDEO_MODEL || 'kling-video/v2.5-turbo/standard/image-to-video' }}
          AI_VIDEO_BUDGET_USD: ${{ vars.AI_VIDEO_BUDGET_USD || '1.10' }}          # sizes a reel's clips (6 at $0.1575)
          AI_VIDEO_TIMEOUT_SECONDS: ${{ vars.AI_VIDEO_TIMEOUT_SECONDS || '300' }}  # the whole Higgsfield phase
          AI_VIDEO_GRACE_SECONDS: ${{ vars.AI_VIDEO_GRACE_SECONDS || '120' }}      # more wait for clips already running
          AI_VIDEO_TAIL_SECONDS: ${{ vars.AI_VIDEO_TAIL_SECONDS || '240' }}        # what a reel needs after visuals
          AI_VIDEO_CUTS: ${{ vars.AI_VIDEO_CUTS || 'pauses' }}                    # pauses | clip
          AI_VIDEO_STYLE: ${{ vars.AI_VIDEO_STYLE }}                              # empty = the 3D film look
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The live bot is a webhook, and Telegram refuses getUpdates while one is set (409).
          TELEGRAM_APPROVAL_MODE: ${{ vars.TELEGRAM_APPROVAL_MODE || 'webhook' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VOICE_ENGINE: ${{ vars.VOICE_ENGINE || 'gemini' }}          # gemini | google | edge | kokoro (chain)
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}       # Chirp 3 HD; empty -> falls back to edge-tts
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}              # an en-IN Chirp3-HD voice name
          GOOGLE_TTS_VOICE_HI: ${{ vars.GOOGLE_TTS_VOICE_HI }}        # the Hindi Chirp voice (default hi-IN-Chirp3-HD-Charon)
          NARRATION_LANGUAGE: ${{ vars.NARRATION_LANGUAGE }}          # english (default) | hinglish (design 7)
          HINGLISH_STRICT: ${{ vars.HINGLISH_STRICT }}                # true (default): a meaning check that cannot run fails
          HINGLISH_MIN_SECONDS: ${{ vars.HINGLISH_MIN_SECONDS }}      # spoken-length band (default 24)
          HINGLISH_MAX_SECONDS: ${{ vars.HINGLISH_MAX_SECONDS }}      # spoken-length band (default 36)
          GOOGLE_TTS_LANGUAGE: ${{ vars.GOOGLE_TTS_LANGUAGE || 'en-IN' }}
          ENABLE_HUMAN_ANGLE: ${{ vars.ENABLE_HUMAN_ANGLE || 'true' }}  # require a genuine why-it-matters take
          CAPTION_FONT: ${{ vars.CAPTION_FONT || 'Montserrat' }}
          CAPTION_HIGHLIGHT_COLOR: ${{ vars.CAPTION_HIGHLIGHT_COLOR || '&H0000FFFF' }}  # active-word fill colour
          ENABLE_TEXT_CARDS: ${{ vars.ENABLE_TEXT_CARDS || 'false' }}  # key-point cards (off: the key number replaces them)
          CARD_SECONDS: ${{ vars.CARD_SECONDS || '1.8' }}            # how long each key-point card flashes
          NEWS_RSS_URL: ${{ vars.NEWS_RSS_URL }}                     # optional: override the news feed seeding ideation
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
          VISUAL_SOURCE: ${{ vars.VISUAL_SOURCE || 'photos' }}        # photos | ai | video | ai_video
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          IMAGE_STYLE: ${{ vars.IMAGE_STYLE }}
          CAPTION_WORDS: ${{ vars.CAPTION_WORDS || '3' }}            # words per karaoke phrase
          ENABLE_DESC_FOOTER: ${{ vars.ENABLE_DESC_FOOTER || 'true' }}  # append brand footer to descriptions
          DESCRIPTION_FOOTER: ${{ vars.DESCRIPTION_FOOTER }}         # optional: override the default footer
          ENABLE_HOOK_CAPTION: ${{ vars.ENABLE_HOOK_CAPTION || 'true' }}  # frame-1 title hook banner (CTR)
          HOOK_SECONDS: ${{ vars.HOOK_SECONDS || '1.8' }}            # how long the hook banner shows
          CLIP_SECONDS: ${{ vars.CLIP_SECONDS || '3.5' }}           # B-roll cut length (fast = more retention)
          ENABLE_HOOK_JUDGE: ${{ vars.ENABLE_HOOK_JUDGE || 'false' }} # off since 2026-11-12 (design 9.2): it rewrote the writer's opening
          KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '1.0' }}
          ENABLE_DRAMATIC_PACING: ${{ vars.ENABLE_DRAMATIC_PACING || 'true' }}  # snappier mid-script + beat before payoff
          PAUSE_BETWEEN: ${{ vars.PAUSE_BETWEEN || '0.18' }}        # inter-sentence silence (s)
          PAUSE_BEFORE_PAYOFF: ${{ vars.PAUSE_BEFORE_PAYOFF || '0.5' }}  # dramatic beat before the last line (s)
          MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME || '0.10' }}
          ENABLE_SFX: ${{ vars.ENABLE_SFX || 'false' }}             # transition stings on clip cuts (off since stage 4b)
          SFX_VOLUME: ${{ vars.SFX_VOLUME || '0.18' }}              # 0..1; 0 disables. >0.3 fights the narration
          SFX_EVERY_N_CUTS: ${{ vars.SFX_EVERY_N_CUTS || '2' }}     # sting every Nth cut (1 = every cut, busy)
          ENABLE_LOUDNORM: ${{ vars.ENABLE_LOUDNORM || 'true' }}    # level each reel to TARGET_LUFS (reels shipped at -17..-23)
          TARGET_LUFS: ${{ vars.TARGET_LUFS || '-14' }}              # finished-mix loudness; YouTube plays at -14
          ENABLE_VOICE_COMPRESS: ${{ vars.ENABLE_VOICE_COMPRESS || 'true' }}  # light 3:1 broadcast compression on the voice
          MUSIC_LU_BELOW_VOICE: ${{ vars.MUSIC_LU_BELOW_VOICE || '4' }}      # bed level under the voice (was 11 before stage 4b)
          ENABLE_MUSIC_OFFSET: ${{ vars.ENABLE_MUSIC_OFFSET || 'true' }}      # each reel starts its bed at a different bar
          ENABLE_GRAPHIC_CARDS: ${{ vars.ENABLE_GRAPHIC_CARDS || 'false' }}  # PIL stat cards vs ASS text cards
          ENABLE_CHANNEL_TAGS: ${{ vars.ENABLE_CHANNEL_TAGS || 'true' }}     # append the brand tag after the writer's tags
          # Optional 3rd LLM provider. GH_ prefix is REQUIRED: GitHub rejects secret/variable
          # names starting with GITHUB_. Inert unless ENABLE_GH_MODELS/PREFER_GH_MODELS is true.
          GH_MODELS_KEY: ${{ secrets.GH_MODELS_KEY }}               # PAT scoped to `models: read` only
          ENABLE_GH_MODELS: ${{ vars.ENABLE_GH_MODELS || 'false' }}  # opt-in: middle fallback
          PREFER_GH_MODELS: ${{ vars.PREFER_GH_MODELS || 'false' }}  # opt-in: try it first
          GH_MODEL: ${{ vars.GH_MODEL || 'openai/gpt-4o-mini' }}     # publisher/model form is required
          # Expressive delivery. Tag support differs per engine: Chirp reads [pause] via markup,
          # Gemini TTS reads [sarcastic]-style tags, edge/Kokoro read neither.
          GOOGLE_TTS_SPEAKING_RATE: ${{ vars.GOOGLE_TTS_SPEAKING_RATE }}  # 0.25-2.0, unset = default
          ENABLE_PAUSE_MARKUP: ${{ vars.ENABLE_PAUSE_MARKUP || 'true' }}  # [pause] -> Chirp markup
          MAX_PAUSE_TAGS: ${{ vars.MAX_PAUSE_TAGS || '3' }}
          MAX_STYLE_TAGS: ${{ vars.MAX_STYLE_TAGS || '3' }}
          ENABLE_TAG_FLOOR: ${{ vars.ENABLE_TAG_FLOOR || 'true' }}     # >=1 tag: [serious] on the payoff turn
          SFX_DIR: ${{ vars.SFX_DIR }}                              # where generated SFX wavs cache
          CAPTION_FONT_FILE: ${{ vars.CAPTION_FONT_FILE }}          # ttf for libass + stat cards
          VOICE_STYLE_PROMPT: ${{ vars.VOICE_STYLE_PROMPT }}          # gemini engine only; 'off' = no direction (the pre-09-01 sound)
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.1-flash-tts-preview' }}  # voiced on Vertex since 2026-11-12 (the Developer API retires it 2026-11-17); then Vertex 2.5, same voice, before Chirp
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Zubenelgenubi' }}  # chosen by ear; bare name
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}       # optional; isolates TTS quota
          GEMINI_TTS_VERTEX_FALLBACK: ${{ vars.GEMINI_TTS_VERTEX_FALLBACK || 'true' }}  # Vertex voices the channel (billed, cents a reel); false = Developer API only
          GEMINI_TTS_TIMEOUT_SECONDS: ${{ vars.GEMINI_TTS_TIMEOUT_SECONDS || '120' }}  # the SDK default is no timeout at all
          DAILY_REEL_CAP: ${{ vars.DAILY_REEL_CAP || '3' }}           # operator ships 3 Shorts/day
          APPROVAL_CAP: ${{ vars.APPROVAL_CAP || '3' }}               # keep approvals in step with it
          ENABLE_FACT_CHECK: ${{ vars.ENABLE_FACT_CHECK || 'true' }}   # re-verify every script pre-render
          FACTCHECK_SEVERITY: ${{ vars.FACTCHECK_SEVERITY || 'critical' }} # critical = only fabrication blocks; any = every discrepancy
          FACTCHECK_SAMPLES: ${{ vars.FACTCHECK_SAMPLES || '2' }}      # a finding from either of two checks blocks
          ENABLE_FACTCHECK_REPAIR: ${{ vars.ENABLE_FACTCHECK_REPAIR || 'true' }}  # rewrite blocked claims once, re-check
          ENABLE_SCRIPT_TIGHTEN: ${{ vars.ENABLE_SCRIPT_TIGHTEN || 'false' }}  # retired 2026-11-12: the writer marks optional sentences
          SCRIPT_TARGET_SECONDS: ${{ vars.SCRIPT_TARGET_SECONDS }}  # default 27 (about 59 words)
          SCRIPT_MAX_SECONDS: ${{ vars.SCRIPT_MAX_SECONDS }}        # default 33 (about 73 words)
          IDEA_DEDUP_DAYS: ${{ vars.IDEA_DEDUP_DAYS || '10' }}           # story-level dedup window
          WINNERS_SINCE: ${{ vars.WINNERS_SINCE }}                     # optional: the relaunch date; unset keeps the winners block off
          ELECTION_SILENCE: ${{ vars.ELECTION_SILENCE }}               # optional: State:YYYY-MM-DD pairs, no election matter in the 48 h before
          DEMAND_CHANNELS: ${{ vars.DEMAND_CHANNELS }}                 # optional: channel ids for the demand signal (default: the India research's sample)
          NEWS_INDIA_QUERIES: ${{ vars.NEWS_INDIA_QUERIES }}           # optional: Google News searches for an Indian stake
          FACTCHECK_STRICT: ${{ vars.FACTCHECK_STRICT || 'false' }}    # true = block when the checker cannot run
          # Groq bills gpt-oss reasoning tokens against max_tokens; at the default effort the
          # trace eats the budget and json_object mode 400s. 'low' keeps the fallback alive.
          GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT || 'low' }}
          # Settable without a code edit: the last two breakages were both the Groq model,
          # and both needed a commit to swap because this was wired nowhere.
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          # HTTP-probe ideation's source URLs; drop 404/410 (invented links), keep 401/403.
          ENABLE_SOURCE_CHECK: ${{ vars.ENABLE_SOURCE_CHECK || 'true' }}
          # Source an under-sourced idea from the free Google News RSS search (no key, no
          # quota) instead of dropping it. This is what keeps the digest full on a day the
          # grounded search is out of free calls.
          ENABLE_SOURCE_SEARCH: ${{ vars.ENABLE_SOURCE_SEARCH || 'true' }}
          # Optional: a separate Developer-API key for the gate. It mattered on the Developer
          # tier's 20 grounded requests/day; on Vertex (the default here) quota is per project
          # and this key is not used.
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
          # Set false to skip the scriptwriter's grounded write and hand that request back
          # to the gate — the gate is worth more, it re-verifies the finished script.
          ENABLE_GROUNDED_SCRIPT: ${{ vars.ENABLE_GROUNDED_SCRIPT || 'true' }}
          # Pending ideas older than this are aged out to 'passed' rather than re-offered
          # as today's digest. 0 disables.
          IDEA_MAX_AGE_HOURS: ${{ vars.IDEA_MAX_AGE_HOURS || '24' }}
          # The Python step's own timeout-minutes (55), not the job's (60): counted from the
          # job's start, it can then never be later than the real kill (design 6.4). A reel is
          # not started when it would be killed before it finished.
          JOB_TIMEOUT_MINUTES: '55'
          CRASH_NOTE_FILE: ${{ runner.temp }}/crash-notified   # see make-short.yml
        run: python -m src.production

      - name: Tell Telegram the run stopped
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKER: ${{ runner.temp }}/crash-notified
          TEXT: "💥 production stopped before finishing (${{ job.status }}). ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          [ -f "$MARKER" ] && exit 0
          curl -sS -m 20 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}" || true
