# Analytics — pull public stats for published Shorts so ideation learns what works.
# Runs daily, and its writes are also what keeps the free Supabase project from pausing.
name: analytics

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily (GitHub starts it 5-8 h late; the time doesn't matter)

jobs:
  analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write     # the keep-alive step below re-enables the scheduled workflows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # This job only calls the YouTube Data API and writes rows. Installing the full
      # pipeline (Kokoro, faster-whisper, Pillow, ~hundreds of MB) bought nothing.
      # Same pins as requirements.txt (google-auth was 2.53.0 here, 2.58.1 there).
      - run: pip install "google-api-python-client==2.197.0" "google-auth==2.58.1" "supabase==2.31.0" "python-dotenv==1.2.2"
      - name: Collect YouTube stats → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # The removed-Shorts alert sends from here; without these it never reached anyone.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.analytics

      # GitHub disables a public repo's scheduled workflows after 60 days without a commit
      # (the next would be about 2026-11-28). The pipeline runs on demand, so the repo can go
      # quiet while this job and the daily tests are still needed. Re-enabling resets the timer.
      - name: Keep the scheduled workflows enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in analytics.yml tests.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
