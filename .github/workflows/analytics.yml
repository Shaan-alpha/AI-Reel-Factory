# Analytics — pull public stats for published Shorts so ideation learns what works.
# Run manually, or enable the daily schedule below.
name: analytics

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily — auto-collect stats into the learning loop

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # This job only calls the YouTube Data API and writes rows. Installing the full
      # pipeline (Kokoro, faster-whisper, Pillow, ~hundreds of MB) bought nothing.
      - run: pip install "google-api-python-client==2.197.0" "google-auth==2.53.0" "supabase==2.31.0" "python-dotenv==1.2.2"
      - name: Collect YouTube stats → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m src.analytics
